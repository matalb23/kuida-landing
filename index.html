<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kuida</title>
  <meta name="description" content="Kuida acompaña la terapia, la medicación y la calma de tu peque con dolor crónico pediátrico. Kuida supports kids with pediatric chronic pain." />
  <link rel="icon" href="assets/favicon.png" />
  <link rel="stylesheet" href="css/styles.css" />
  <script data-goatcounter="https://kuida-landing.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  <script>
    (function () {
      var lang = (navigator.language || navigator.userLanguage || "es").slice(0, 2).toLowerCase();
      if (lang === "en") {
        location.replace("en/");
      } else if (lang === "pt") {
        location.replace("pt/");
      } else {
        location.replace("es/");
      }
    })();
  </script>
</head>
<body>
  <div class="container hero">
    <img src="assets/icon.png" alt="Kuida" />
    <h1>Kuida</h1>
    <p class="tagline">
      Elegí tu idioma · Choose your language · Escolha seu idioma
    </p>
    <p>
      <a href="es/">🇦🇷 Español</a> ·
      <a href="en/">🇬🇧 English</a> ·
      <a href="pt/">🇧🇷 Português</a>
    </p>
  </div>
</body>
</html>
